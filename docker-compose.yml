version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jathagam_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jathagam_matcher_bot
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '${PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/jathagam_matcher
      - NODE_ENV=development
    volumes:
      - temp_data:/app/temp

volumes:
  mongodb_data:
  temp_data:
